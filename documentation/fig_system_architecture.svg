<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr"   markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#333"/>
    </marker>
    <marker id="arr-y" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#b08800"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#3a7d3a"/>
    </marker>
  </defs>

  <!-- ===================== AUTHORING-TIME BAND ===================== -->
  <rect x="10" y="10" width="960" height="380" rx="10"
        fill="#edf4fb" stroke="#5b8fc0" stroke-width="1.5"/>
  <text x="30" y="35" font-size="14" font-weight="bold" fill="#1a4f86">
    AUTHORING TIME — offline, once per site (cloud tier optional, replaceable)
  </text>

  <!-- Layer 1: capture + MPS -->
  <text x="30" y="60" font-size="11" font-weight="bold" fill="#444">
    Layer 1 — Spatial substrate
  </text>

  <rect x="30" y="75" width="140" height="85" rx="6"
        fill="white" stroke="#5b8fc0" stroke-width="1.5"/>
  <text x="100" y="97"  text-anchor="middle" font-size="12" font-weight="bold">Aria capture</text>
  <text x="100" y="115" text-anchor="middle" font-size="10" fill="#555">expert walks site,</text>
  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#555">narrates once</text>
  <text x="100" y="145" text-anchor="middle" font-size="10" fill="#555">.vrs recording</text>

  <line x1="170" y1="118" x2="200" y2="118" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="75" width="170" height="85" rx="6"
        fill="white" stroke="#5b8fc0" stroke-width="1.5"/>
  <text x="285" y="97"  text-anchor="middle" font-size="12" font-weight="bold">Aria MPS + Whisper</text>
  <text x="285" y="113" text-anchor="middle" font-size="10" fill="#555">closed-loop trajectory</text>
  <text x="285" y="125" text-anchor="middle" font-size="10" fill="#555">semi-dense point cloud</text>
  <text x="285" y="137" text-anchor="middle" font-size="10" fill="#555">eye-gaze · hand-tracking</text>
  <text x="285" y="149" text-anchor="middle" font-size="10" fill="#555">timed transcript</text>

  <!-- Cloud tier accessory -->
  <rect x="720" y="55" width="240" height="105" rx="6"
        fill="#fff5dc" stroke="#b08800" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="840" y="78"  text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5e00">
    Cloud tier (authoring only)
  </text>
  <text x="840" y="100" text-anchor="middle" font-size="11" fill="#5a4500">Gemini 2.5 VLM</text>
  <text x="840" y="116" text-anchor="middle" font-size="10" fill="#5a4500">→ Stage 2 anchor narrative</text>
  <text x="840" y="129" text-anchor="middle" font-size="10" fill="#5a4500">→ Stage 3 edge rationale</text>
  <text x="840" y="148" text-anchor="middle" font-size="9" font-style="italic" fill="#7a5e00">
    replaceable by self-hosted endpoint
  </text>

  <!-- Layer 2: three stages -->
  <text x="30" y="195" font-size="11" font-weight="bold" fill="#444">
    Layer 2 — Authoring pipeline (three stages)
  </text>

  <!-- Stage 1 -->
  <rect x="30" y="210" width="220" height="135" rx="6"
        fill="#d2e3f4" stroke="#3a78b9" stroke-width="1.5"/>
  <text x="140" y="232" text-anchor="middle" font-size="12" font-weight="bold">
    Stage 1 — Multimodal extraction
  </text>
  <text x="140" y="253" text-anchor="middle" font-size="10" fill="#222">gaze → world-space ray</text>
  <text x="140" y="267" text-anchor="middle" font-size="10" fill="#222">snap to PCD via Open3D KDTree</text>
  <text x="140" y="281" text-anchor="middle" font-size="10" fill="#222">4-tier quality (Snap Rule)</text>
  <text x="140" y="295" text-anchor="middle" font-size="10" fill="#222">DBSCAN → gaze events</text>
  <text x="140" y="309" text-anchor="middle" font-size="10" fill="#222">+ hand stream  + ±5 s transcript</text>
  <text x="140" y="332" text-anchor="middle" font-size="9" font-style="italic" fill="#555">
    spatial_transcript_summarizer.py
  </text>

  <!-- Arrow MPS → Stage 1 -->
  <line x1="285" y1="160" x2="180" y2="210"
        stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="270" y="210" width="220" height="135" rx="6"
        fill="#d2e3f4" stroke="#3a78b9" stroke-width="1.5"/>
  <text x="380" y="232" text-anchor="middle" font-size="12" font-weight="bold">
    Stage 2 — Narrative synthesis
  </text>
  <text x="380" y="253" text-anchor="middle" font-size="10" fill="#222">spatial grouping of events</text>
  <text x="380" y="267" text-anchor="middle" font-size="10" fill="#222">→ co-located anchors</text>
  <text x="380" y="281" text-anchor="middle" font-size="10" fill="#222">VLM call: title, narrative,</text>
  <text x="380" y="295" text-anchor="middle" font-size="10" fill="#222">objects, actions, spatial_props</text>
  <text x="380" y="309" text-anchor="middle" font-size="10" fill="#222">grounds deixis via gaze + hand</text>
  <text x="380" y="332" text-anchor="middle" font-size="9" font-style="italic" fill="#555">
    narrative_synthesizer.py
  </text>

  <!-- Stage 3 -->
  <rect x="510" y="210" width="220" height="135" rx="6"
        fill="#d2e3f4" stroke="#3a78b9" stroke-width="1.5"/>
  <text x="620" y="232" text-anchor="middle" font-size="12" font-weight="bold">
    Stage 3 — KG &amp; point derivation
  </text>
  <text x="620" y="253" text-anchor="middle" font-size="10" fill="#222">BGE-M3 narrative embeddings</text>
  <text x="620" y="267" text-anchor="middle" font-size="10" fill="#222">W = αS + βT + γP,  W ≥ τ</text>
  <text x="620" y="281" text-anchor="middle" font-size="10" fill="#222">VLM edge rationale</text>
  <text x="620" y="295" text-anchor="middle" font-size="10" fill="#222">→ geolocalized narrative points</text>
  <text x="620" y="332" text-anchor="middle" font-size="9" font-style="italic" fill="#555">
    semantic_network_builder.py
  </text>

  <!-- Inter-stage labelled arrows -->
  <line x1="250" y1="278" x2="270" y2="278"
        stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260" y="272" text-anchor="middle" font-size="9" fill="#555">events</text>

  <line x1="490" y1="278" x2="510" y2="278"
        stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500" y="272" text-anchor="middle" font-size="9" fill="#555">anchors</text>

  <line x1="730" y1="278" x2="755" y2="278"
        stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Published artifacts -->
  <rect x="755" y="210" width="200" height="135" rx="6"
        fill="white" stroke="#3a78b9" stroke-width="1.5"/>
  <text x="855" y="232" text-anchor="middle" font-size="12" font-weight="bold">Published artifacts</text>
  <text x="855" y="253" text-anchor="middle" font-size="10" fill="#222">georeferenced PCD (.ply)</text>
  <text x="855" y="267" text-anchor="middle" font-size="10" fill="#222">narrative anchors (.json)</text>
  <text x="855" y="281" text-anchor="middle" font-size="10" fill="#222">knowledge graph (.json)</text>
  <text x="855" y="295" text-anchor="middle" font-size="10" fill="#222">trajectory_latlon (.json)</text>
  <text x="855" y="309" text-anchor="middle" font-size="10" fill="#222">expert audio + event clips</text>

  <!-- Stage 2/3 → cloud, dashed -->
  <line x1="430" y1="210" x2="760" y2="160"
        stroke="#b08800" stroke-width="1" stroke-dasharray="4,3"
        marker-end="url(#arr-y)"/>
  <line x1="660" y1="210" x2="820" y2="160"
        stroke="#b08800" stroke-width="1" stroke-dasharray="4,3"
        marker-end="url(#arr-y)"/>

  <!-- ===================== RUNTIME BAND ===================== -->
  <rect x="10" y="410" width="960" height="160" rx="10"
        fill="#e8f3e6" stroke="#5b9c5b" stroke-width="1.5"/>
  <text x="30" y="435" font-size="14" font-weight="bold" fill="#2f6c2f">
    RUNTIME — offline, edge tier only · no inference · no uplink
  </text>
  <text x="30" y="455" font-size="11" font-weight="bold" fill="#444">Layer 3 — Offline runtime</text>

  <!-- Edge node -->
  <rect x="30" y="465" width="280" height="95" rx="6"
        fill="white" stroke="#5b9c5b" stroke-width="1.5"/>
  <text x="170" y="487" text-anchor="middle" font-size="12" font-weight="bold">
    Edge node — Raspberry Pi 5 + battery
  </text>
  <text x="170" y="505" text-anchor="middle" font-size="10" fill="#222">Node.js: PWA, scene, anchors,</text>
  <text x="170" y="519" text-anchor="middle" font-size="10" fill="#222">graph, audio, event clips</text>
  <text x="170" y="533" text-anchor="middle" font-size="10" fill="#222">WebSocket GPS relay (port 8080)</text>
  <text x="170" y="551" text-anchor="middle" font-size="9" font-style="italic" fill="#555">
    self-hosted Wi-Fi access point
  </text>

  <!-- Artifacts → edge node, dashed (one-time copy) -->
  <polyline points="855,345 855,400 170,400 170,465"
            fill="none" stroke="#333" stroke-width="1.5"
            stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="512" y="395" text-anchor="middle" font-size="10" fill="#555" font-style="italic">
    copied to edge node (one-time, offline)
  </text>

  <!-- Visitor devices -->
  <rect x="350" y="465" width="180" height="95" rx="6"
        fill="white" stroke="#5b9c5b" stroke-width="1.5"/>
  <text x="440" y="487" text-anchor="middle" font-size="12" font-weight="bold">GPS phone</text>
  <text x="440" y="510" text-anchor="middle" font-size="10" fill="#222">publishes WGS-84 fix</text>
  <text x="440" y="525" text-anchor="middle" font-size="10" fill="#222">→ WebSocket relay</text>

  <rect x="560" y="465" width="180" height="95" rx="6"
        fill="white" stroke="#5b9c5b" stroke-width="1.5"/>
  <text x="650" y="487" text-anchor="middle" font-size="12" font-weight="bold">Wi-Fi tablet · wearable</text>
  <text x="650" y="510" text-anchor="middle" font-size="10" fill="#222">no GPS — subscribes to relay</text>
  <text x="650" y="525" text-anchor="middle" font-size="10" fill="#222">renders PWA + plays audio</text>

  <!-- WebSocket arrows between edge node and devices -->
  <line x1="310" y1="495" x2="350" y2="495"
        stroke="#3a7d3a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="330" y="488" text-anchor="middle" font-size="8" fill="#3a7d3a">PWA · audio</text>

  <line x1="350" y1="540" x2="310" y2="540"
        stroke="#3a7d3a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="330" y="553" text-anchor="middle" font-size="8" fill="#3a7d3a">GPS fix</text>

  <line x1="540" y1="495" x2="560" y2="495"
        stroke="#3a7d3a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="550" y="488" text-anchor="middle" font-size="8" fill="#3a7d3a">relay</text>

  <!-- Legend -->
  <rect x="755" y="465" width="200" height="95" rx="6"
        fill="#f5faf4" stroke="#5b9c5b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="855" y="484" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f6c2f">Legend</text>
  <line x1="770" y1="498" x2="800" y2="498" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="808" y="502" font-size="9" fill="#222">data flow</text>
  <line x1="770" y1="514" x2="800" y2="514" stroke="#b08800" stroke-width="1.5"
        stroke-dasharray="4,3" marker-end="url(#arr-y)"/>
  <text x="808" y="518" font-size="9" fill="#222">VLM call (authoring only)</text>
  <line x1="770" y1="530" x2="800" y2="530" stroke="#333" stroke-width="1.5"
        stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="808" y="534" font-size="9" fill="#222">artifact transfer</text>
  <line x1="770" y1="546" x2="800" y2="546" stroke="#3a7d3a" stroke-width="1.5"
        marker-end="url(#arr-g)"/>
  <text x="808" y="550" font-size="9" fill="#222">WebSocket (runtime)</text>
</svg>
