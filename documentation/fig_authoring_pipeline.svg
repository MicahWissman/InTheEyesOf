<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#000"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Cloud VLM (accessory, above stages 2-3) -->
  <rect x="430" y="20" width="200" height="50" rx="6"
        fill="white" stroke="#000" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="530" y="42" text-anchor="middle" font-size="13" font-weight="bold">VLM (Gemini)</text>
  <text x="530" y="60" text-anchor="middle" font-size="10" font-style="italic" fill="#444">
    authoring-time only
  </text>

  <!-- Main row: Input → Stage 1 → Stage 2 → Stage 3 -->

  <!-- Input -->
  <rect x="20" y="125" width="170" height="70" rx="6"
        fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="105" y="152" text-anchor="middle" font-size="13" font-weight="bold">
    Egocentric recording
  </text>
  <text x="105" y="172" text-anchor="middle" font-size="10" fill="#444">
    .vrs · MPS · transcript
  </text>

  <line x1="190" y1="160" x2="225" y2="160"
        stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 1 -->
  <rect x="225" y="125" width="170" height="70" rx="6"
        fill="white" stroke="#000" stroke-width="2"/>
  <text x="310" y="152" text-anchor="middle" font-size="13" font-weight="bold">Stage 1</text>
  <text x="310" y="172" text-anchor="middle" font-size="11">Multimodal extraction</text>

  <line x1="395" y1="160" x2="445" y2="160"
        stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="154" text-anchor="middle" font-size="10" font-style="italic" fill="#444">events</text>

  <!-- Stage 2 -->
  <rect x="445" y="125" width="170" height="70" rx="6"
        fill="white" stroke="#000" stroke-width="2"/>
  <text x="530" y="152" text-anchor="middle" font-size="13" font-weight="bold">Stage 2</text>
  <text x="530" y="172" text-anchor="middle" font-size="11">Narrative synthesis</text>

  <line x1="615" y1="160" x2="665" y2="160"
        stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="640" y="154" text-anchor="middle" font-size="10" font-style="italic" fill="#444">anchors</text>

  <!-- Stage 3 -->
  <rect x="665" y="125" width="230" height="70" rx="6"
        fill="white" stroke="#000" stroke-width="2"/>
  <text x="780" y="152" text-anchor="middle" font-size="13" font-weight="bold">Stage 3</text>
  <text x="780" y="172" text-anchor="middle" font-size="11">Knowledge graph + points</text>

  <!-- Dashed arrows from Cloud VLM down to Stage 2 and Stage 3 -->
  <line x1="490" y1="70" x2="510" y2="125"
        stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"
        marker-end="url(#arrd)"/>
  <line x1="580" y1="70" x2="760" y2="125"
        stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"
        marker-end="url(#arrd)"/>
</svg>
