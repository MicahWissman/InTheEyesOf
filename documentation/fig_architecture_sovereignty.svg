<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr"  markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L0,9 L9,4.5 z" fill="#000"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L0,9 L9,4.5 z" fill="#666"/>
    </marker>
  </defs>

  <!-- ============================================================
       GRID
         Outer margin    : 20
         Boxes           : x ∈ {20, 320, 620, 920}, w = 280
         Gutters         : 20 (between boxes)
         Main-row y      : 120, h = 180  (covers 120-300)
         Cloud y         : 20, h = 60
         Caption y       : 320
       ============================================================ -->

  <!-- Cloud accessory (above Layer 2) -->
  <rect x="420" y="20" width="200" height="60" rx="4"
        fill="#ffffff" stroke="#000" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="520" y="48" text-anchor="middle" font-size="13" font-weight="bold">VLM  (Gemini 2.5)</text>
  <text x="520" y="66" text-anchor="middle" font-size="10" font-style="italic" fill="#555">
    cloud · authoring-time only
  </text>

  <!-- Dashed arrow Cloud → Layer 2 -->
  <line x1="520" y1="82" x2="450" y2="118"
        stroke="#666" stroke-width="1.2" stroke-dasharray="4,3"
        marker-end="url(#arrg)"/>

  <!-- ===================== Layer 1 ===================== -->
  <rect x="20" y="120" width="280" height="180" rx="4"
        fill="#f0f0f0" stroke="#000" stroke-width="1.5"/>
  <text x="160" y="150" text-anchor="middle" font-size="14" font-weight="bold">Layer 1</text>
  <text x="160" y="170" text-anchor="middle" font-size="12" font-weight="bold">Spatial substrate</text>
  <text x="160" y="200" text-anchor="middle" font-size="11" fill="#222">Project Aria egocentric capture</text>
  <text x="160" y="218" text-anchor="middle" font-size="11" fill="#222">MPS SLAM trajectory</text>
  <text x="160" y="236" text-anchor="middle" font-size="11" fill="#222">semi-dense point cloud</text>
  <text x="160" y="254" text-anchor="middle" font-size="11" fill="#222">georeferenced scene</text>
  <text x="160" y="282" text-anchor="middle" font-size="10" font-style="italic" fill="#555">edge</text>

  <line x1="300" y1="210" x2="320" y2="210" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===================== Layer 2 ===================== -->
  <rect x="320" y="120" width="280" height="180" rx="4"
        fill="#f0f0f0" stroke="#000" stroke-width="1.5"/>
  <text x="460" y="150" text-anchor="middle" font-size="14" font-weight="bold">Layer 2</text>
  <text x="460" y="170" text-anchor="middle" font-size="12" font-weight="bold">Authoring-time analysis</text>
  <text x="460" y="200" text-anchor="middle" font-size="11" fill="#222">1.  multimodal extraction</text>
  <text x="460" y="218" text-anchor="middle" font-size="11" fill="#222">2.  narrative synthesis</text>
  <text x="460" y="236" text-anchor="middle" font-size="11" fill="#222">3.  knowledge graph + points</text>
  <text x="460" y="254" text-anchor="middle" font-size="10" font-style="italic" fill="#555">offline, once per site</text>
  <text x="460" y="282" text-anchor="middle" font-size="10" font-style="italic" fill="#555">edge + optional cloud</text>

  <line x1="600" y1="210" x2="620" y2="210" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===================== Layer 3 ===================== -->
  <rect x="620" y="120" width="280" height="180" rx="4"
        fill="#f0f0f0" stroke="#000" stroke-width="1.5"/>
  <text x="760" y="150" text-anchor="middle" font-size="14" font-weight="bold">Layer 3</text>
  <text x="760" y="170" text-anchor="middle" font-size="12" font-weight="bold">Offline runtime</text>
  <text x="760" y="200" text-anchor="middle" font-size="11" fill="#222">Node.js on edge node</text>
  <text x="760" y="218" text-anchor="middle" font-size="11" fill="#222">serves scene · anchors · audio</text>
  <text x="760" y="236" text-anchor="middle" font-size="11" fill="#222">WebSocket GPS relay</text>
  <text x="760" y="254" text-anchor="middle" font-size="11" fill="#222">PWA for visitor devices</text>
  <text x="760" y="282" text-anchor="middle" font-size="10" font-style="italic" fill="#555">edge · no inference · no uplink</text>

  <line x1="900" y1="210" x2="920" y2="210" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="910" y="204" text-anchor="middle" font-size="9" font-style="italic" fill="#444">serves</text>

  <!-- ===================== Knowledge sovereignty ===================== -->
  <rect x="920" y="120" width="340" height="180" rx="4"
        fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="1090" y="146" text-anchor="middle" font-size="13" font-weight="bold">Knowledge sovereignty</text>

  <!-- Layer A -->
  <rect x="934" y="158" width="312" height="38" rx="3"
        fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
  <text x="1090" y="175" text-anchor="middle" font-size="11" font-weight="bold">
    A — Expert's verbatim words
  </text>
  <text x="1090" y="190" text-anchor="middle" font-size="9" font-style="italic" fill="#444">
    zero-latency · ground truth
  </text>

  <line x1="1090" y1="198" x2="1090" y2="210" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Layer B -->
  <rect x="934" y="212" width="312" height="38" rx="3"
        fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
  <text x="1090" y="229" text-anchor="middle" font-size="11" font-weight="bold">
    B — AI interpretation
  </text>
  <text x="1090" y="244" text-anchor="middle" font-size="9" font-style="italic" fill="#444">
    pre-computed · attributed
  </text>

  <line x1="1090" y1="252" x2="1090" y2="264" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Layer C -->
  <rect x="934" y="266" width="312" height="28" rx="3"
        fill="#ffffff" stroke="#000" stroke-width="1.0" stroke-dasharray="3,2"/>
  <text x="1090" y="285" text-anchor="middle" font-size="10" font-style="italic" fill="#333">
    C — Live conversation (roadmap)
  </text>

  <!-- ===================== Caption ===================== -->
  <text x="640" y="324" text-anchor="middle" font-size="11" font-style="italic" fill="#555">
    Layers 1–3 run fully on the edge; the cloud VLM is invoked only at authoring time. Source truth precedes interpretation, which precedes conversation.
  </text>
</svg>
