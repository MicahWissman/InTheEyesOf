<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Narrative 3D Viewer</title>
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: sans-serif; overflow: hidden; }
        canvas { display: block; }
        #info-panel {
            position: absolute; top: 20px; right: 20px; width: 350px; 
            background: rgba(20, 20, 20, 0.9); padding: 20px; border-radius: 12px;
            border: 1px solid #333; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #ff5252; }
        .metadata { font-size: 0.8em; color: #888; margin-bottom: 10px; }
        .narrative { line-height: 1.4; color: #ccc; }
        .video-container { margin-top: 15px; border-radius: 8px; overflow: hidden; background: #000; }
        video { width: 100%; display: block; }
        #header { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        #header h1 { margin: 0; font-size: 1.5em; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="header">
        <h1>In The Eyes Of: Narrative Synthesis</h1>
    </div>

    <div id="info-panel">
        <h2 id="n-title">Narrative Node</h2>
        <div class="metadata" id="n-meta">Time: 0.0s | Duration: 0.0s</div>
        <div class="narrative" id="n-desc">Click a node to view the spatial narrative.</div>
        <div class="video-container">
            <video id="n-video" controls loop></video>
        </div>
    </div>

    <!-- Load Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let nodes = [];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);

            // Placeholder Grid
            const gridHelper = new THREE.GridHelper(10, 10, 0x333333, 0x111111);
            scene.add(gridHelper);

            // TODO: Load SLAM Point Cloud (from cloudcompare_trajectory.csv)
            // loadTrajectoryData('cloudcompare_trajectory.csv');

            // TODO: Load Narrative Nodes (from narrative_results.json)
            // loadNarrativeNodes('narrative_results.json');

            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('click', onClick, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onClick(event) {
            // Raycasting logic to select nodes
        }

        // Example: loadTrajectoryData function would parse CSV and create a BufferGeometry
        // Example: loadNarrativeNodes function would create glowing Mesh spheres at coordinates
    </script>
</body>
</html>
